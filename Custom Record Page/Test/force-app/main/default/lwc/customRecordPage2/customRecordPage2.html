<template>
    <div class="slds-card" style={backgroundStyle}>
        <div class="slds-p-around_medium" style="background-color: rgba(255, 255, 255, 0.85); border-radius: 4px;">
            
            <template if:true={hasLayout}>
                <lightning-record-edit-form record-id={recordId} object-api-name={objectApiName} onsuccess={handleSuccess} onerror={handleError}>
                    <div class="slds-grid slds-wrap">
                        <template for:each={parsedLayout.sections} for:item="section">
                            <div key={section.id} class={section.widthClass}>
                                <div class="slds-section slds-is-open slds-m-bottom_medium">
                                    <h3 class="slds-section__title slds-theme_shade">
                                        <span class="slds-truncate slds-p-horizontal_small">{section.name}</span>
                                    </h3>
                                    <div class={section.fieldsContainerClass}>
                                        <!-- Parent Fields -->
                                        <template for:each={section.fields} for:item="field">
                                            <div key={field.apiName} class={section.columnClass}>
                                                <template if:true={field.readOnly}>
                                                    <lightning-output-field field-name={field.apiName}></lightning-output-field>
                                                </template>
                                                <template if:false={field.readOnly}>
                                                    <lightning-input-field field-name={field.apiName} required={field.required}></lightning-input-field>
                                                </template>
                                            </div>
                                        </template>
                                        
                                        <!-- Subsections -->
                                        <template if:true={section.subsections}>
                                            <template for:each={section.subsections} for:item="sub">
                                                <div key={sub.id} class="slds-col slds-size_1-of-1 slds-section slds-is-open slds-m-top_small slds-p-left_medium" style="border-left: 2px solid #dddddd;">
                                                    <h4 class="slds-section__title slds-theme_shade" style="font-size: 0.9rem;">
                                                        <span class="slds-truncate slds-p-horizontal_small">{sub.name}</span>
                                                    </h4>
                                                    <div class={sub.fieldsContainerClass}>
                                                        <template for:each={sub.fields} for:item="field">
                                                            <div key={field.apiName} class={sub.columnClass}>
                                                                <template if:true={field.readOnly}>
                                                                    <lightning-output-field field-name={field.apiName}></lightning-output-field>
                                                                </template>
                                                                <template if:false={field.readOnly}>
                                                                    <lightning-input-field field-name={field.apiName} required={field.required}></lightning-input-field>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="slds-m-top_medium slds-text-align_center">
                        <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </template>

            <template if:false={hasLayout}>
                <div class="slds-text-align_center slds-text-color_weak slds-p-around_medium">
                    No active Dynamic Layout found for this object. Please publish a layout using the Dynamic Record Layout Builder.
                </div>
            </template>

        </div>
    </div>
</template>

<template>
    <lightning-card title="Scoring Rules Administration" icon-name="standard:rules">
        <div slot="actions">
            <lightning-button label="Recalculate All" title="Run batch recalculation for all records" icon-name="utility:sync" onclick={runBatchRecalculation}></lightning-button>
        </div>
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Left Panel: Create Rule Form -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-p-bottom_medium">
                    <h2 class="form-title slds-m-bottom_small">Add New Criteria</h2>
                    <div class="slds-form slds-form_stacked">
                        <!-- Object Selection -->
                        <div class="slds-p-vertical_small">
                            <lightning-combobox
                                name="object"
                                label="Target Object"
                                value={selectedObject}
                                placeholder="Select an object"
                                options={objectOptions}
                                onchange={handleObjectChange}
                                required>
                            </lightning-combobox>
                        </div>
                        
                        <!-- Field Selection -->
                        <div class="slds-p-vertical_small">
                            <lightning-combobox
                                data-id="fieldSelect"
                                name="field"
                                label="Target Field"
                                value={selectedField}
                                placeholder="Select a field"
                                options={fieldOptions}
                                onchange={handleFieldChange}
                                required>
                            </lightning-combobox>
                        </div>

                        <!-- Operator Selection -->
                        <div class="slds-p-vertical_small">
                            <lightning-combobox
                                name="operator"
                                label="Operator"
                                value={selectedOperator}
                                placeholder="Select operator"
                                options={operatorOptions}
                                onchange={handleOperatorChange}
                                required>
                            </lightning-combobox>
                        </div>

                        <!-- Value Selection (changes based on field type) -->
                        <div class="slds-p-vertical_small">
                            <template if:true={showValueInput}>
                                <template if:true={isPicklistField}>
                                    <lightning-input
                                        type="text"
                                        name="value"
                                        label="Target Value (Exact Picklist API Name)"
                                        value={selectedValue}
                                        placeholder="Enter picklist value"
                                        onchange={handleValueChange}
                                        required>
                                    </lightning-input>
                                </template>
                                <template if:true={isBooleanField}>
                                    <lightning-combobox
                                        name="value"
                                        label="Target Value"
                                        value={selectedValue}
                                        placeholder="Select True/False"
                                        options={booleanOptions}
                                        onchange={handleValueChange}
                                        required>
                                    </lightning-combobox>
                                </template>
                                <template if:true={isTextField}>
                                    <lightning-input
                                        type="text"
                                        name="value"
                                        label="Target Value"
                                        value={selectedValue}
                                        placeholder="Enter criteria value"
                                        onchange={handleValueChange}
                                        required>
                                    </lightning-input>
                                </template>
                                <template if:true={isNumberField}>
                                    <lightning-input
                                        type="number"
                                        name="value"
                                        label="Target Value"
                                        value={selectedValue}
                                        placeholder="Enter numeric value"
                                        onchange={handleValueChange}
                                        required>
                                    </lightning-input>
                                </template>
                            </template>
                        </div>

                        <!-- Score Input -->
                        <div class="slds-p-vertical_small">
                            <lightning-input
                                type="number"
                                name="score"
                                label="Score (Points to award)"
                                value={scoreValue}
                                placeholder="e.g. 15 or -10"
                                onchange={handleScoreChange}
                                required>
                            </lightning-input>
                            <div class="score-slider slds-m-top_xx-small">
                                <lightning-slider 
                                    label="Adjust Points" 
                                    min="-100" 
                                    max="100" 
                                    value={scoreValue} 
                                    onchange={handleScoreChange}>
                                </lightning-slider>
                            </div>
                        </div>

                        <div class="slds-m-top_medium">
                            <lightning-button 
                                variant="brand" 
                                label="Add Rule" 
                                icon-name="utility:add" 
                                onclick={saveRule} 
                                class="slds-stretch"
                                disabled={isFormInvalid}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <!-- Right Panel: Rules List -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                    <div class="table-container">
                        <div class="slds-grid slds-grid_align-spread slds-p-bottom_small">
                            <h2 class="table-title">Active Rules for {selectedObject}</h2>
                            <lightning-button-icon 
                                icon-name="utility:refresh" 
                                alternative-text="Refresh Rules" 
                                onclick={wiredRules} 
                                variant="border-filled">
                            </lightning-button-icon>
                        </div>

                        <template if:true={isLoading}>
                            <div class="loading-spinner">
                                <lightning-spinner alternative-text="Loading rules..." size="medium"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={isLoading}>
                            <div class="rules-list">
                                <div class="rules-header grid-row">
                                    <div class="col-field">Field Name</div>
                                    <div class="col-operator">Operator</div>
                                    <div class="col-value">Value</div>
                                    <div class="col-score">Score Impact</div>
                                    <div class="col-actions"></div>
                                </div>
                                <template for:each={rules} for:item="rule">
                                    <div key={rule.Id} class="rule-row grid-row fade-in">
                                        <div class="col-field">
                                            <span class="field-badge">{rule.Field_Label__c}</span>
                                            <div class="api-subtext">{rule.Field_Api_Name__c}</div>
                                        </div>
                                        <div class="col-operator">
                                            <span class="operator-badge">{rule.Operator__c}</span>
                                        </div>
                                        <div class="col-value">
                                            <span class="value-text" title={rule.Value__c}>{rule.Value__c}</span>
                                        </div>
                                        <div class="col-score">
                                            <span class="score-badge">{rule.Score__c} pts</span>
                                        </div>
                                        <div class="col-actions">
                                            <lightning-button-icon 
                                                icon-name="utility:delete" 
                                                variant="error" 
                                                alternative-text="Delete Rule"
                                                data-id={rule.Id}
                                                onclick={deleteRule}>
                                            </lightning-button-icon>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
